services:
  - type: web
    runtime: node
    name: bar-par-api
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

  - type: web
    runtime: static
    name: bar-par-web
    branch: main
    rootDir: client
    buildCommand: npm install --no-audit --no-fund && npm run build:web
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
