services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bar_par_kenya
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bar_par_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bar_par_kenya"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  bar_par_postgres:
